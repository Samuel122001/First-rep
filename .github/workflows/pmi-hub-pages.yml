# Builds the PMI Hub web version (Microsoft 365 sign-in, data in Firebase) and
# publishes it to GitHub Pages. Setup: pmi-hub/docs/SETUP.md.
name: Deploy PMI Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pmi-hub/**'
      - '.github/workflows/pmi-hub-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmi-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pmi-hub/package-lock.json
      - run: npm ci
      # The Firebase settings come from the repository variable PMI_FIREBASE_CONFIG
      # (Settings → Secrets and variables → Actions → Variables) or, if that is
      # not set, from pmi-hub/firebase.config.json.
      - run: npm run build:web
        env:
          PMI_FIREBASE_CONFIG: ${{ vars.PMI_FIREBASE_CONFIG }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pmi-hub/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
