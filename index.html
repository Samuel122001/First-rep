<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Fågel</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1e2a38;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    canvas {
      background: #70c5ce;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      max-width: 100vw;
      max-height: 100vh;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <canvas id="spel" width="400" height="600"></canvas>
  <script src="game.js"></script>
</body>
</html>
